<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#111114"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0b429"/>
      <stop offset="100%" stop-color="#d99917"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0b429" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f0b429" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f0b429"/>
    </marker>
    <marker id="arrow-mute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6b73"/>
    </marker>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="760" fill="url(#bg)"/>
  <ellipse cx="600" cy="380" rx="500" ry="280" fill="url(#glow)"/>

  <!-- Title -->
  <text x="60" y="60" fill="#f0b429" font-size="11" font-weight="600" letter-spacing="3">ATOMQUEST GOAL PORTAL · SYSTEM ARCHITECTURE</text>
  <text x="60" y="100" fill="#fafafa" font-size="34" font-family="Instrument Serif, Georgia, serif">Serverless from edge to database.</text>
  <text x="60" y="130" fill="#9b9ba0" font-size="14">Free-tier hosted · zero idle cost · Postgres RLS as the authorisation primitive</text>

  <!-- ============================================================== -->
  <!-- TIER 1 - Clients                                                  -->
  <!-- ============================================================== -->
  <g transform="translate(60,180)">
    <text x="0" y="0" fill="#6b6b73" font-size="10" font-weight="600" letter-spacing="2">CLIENTS</text>

    <g transform="translate(0,15)">
      <rect width="220" height="86" rx="12" fill="#16161a" stroke="#26262b" stroke-width="1"/>
      <text x="20" y="30" fill="#fafafa" font-size="14" font-weight="600">Web browser</text>
      <text x="20" y="50" fill="#9b9ba0" font-size="11">Employees · Managers · Admin</text>
      <text x="20" y="68" fill="#6b6b73" font-size="10">Desktop · mobile · tablet - single responsive app</text>
    </g>

    <g transform="translate(240,15)">
      <rect width="220" height="86" rx="12" fill="#16161a" stroke="#26262b" stroke-width="1"/>
      <text x="20" y="30" fill="#fafafa" font-size="14" font-weight="600">MS Teams · Email</text>
      <text x="20" y="50" fill="#9b9ba0" font-size="11">Notification destinations</text>
      <text x="20" y="68" fill="#6b6b73" font-size="10">Adaptive cards · deep links into the portal</text>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- TIER 2 - Application                                              -->
  <!-- ============================================================== -->
  <g transform="translate(60,330)">
    <text x="0" y="0" fill="#6b6b73" font-size="10" font-weight="600" letter-spacing="2">APPLICATION TIER · VERCEL EDGE NETWORK</text>

    <rect x="0" y="15" width="1080" height="170" rx="14" fill="#13131a" stroke="#2a2a30" stroke-width="1" stroke-dasharray="4 4" filter="url(#soft-shadow)"/>

    <!-- App shells -->
    <g transform="translate(20,40)">
      <rect width="240" height="60" rx="10" fill="#1a1a1f" stroke="#2a2a30"/>
      <text x="16" y="24" fill="#fafafa" font-size="13" font-weight="600">Next.js 14 App Router</text>
      <text x="16" y="44" fill="#9b9ba0" font-size="10">SSR · React Server Components</text>
    </g>
    <g transform="translate(280,40)">
      <rect width="240" height="60" rx="10" fill="#1a1a1f" stroke="#2a2a30"/>
      <text x="16" y="24" fill="#fafafa" font-size="13" font-weight="600">Server Actions</text>
      <text x="16" y="44" fill="#9b9ba0" font-size="10">submitSheet · approve · pushShared · upsertCheckIn</text>
    </g>
    <g transform="translate(540,40)">
      <rect width="240" height="60" rx="10" fill="#1a1a1f" stroke="#2a2a30"/>
      <text x="16" y="24" fill="#fafafa" font-size="13" font-weight="600">API routes</text>
      <text x="16" y="44" fill="#9b9ba0" font-size="10">/api/reports/*.csv · /api/cron/escalations</text>
    </g>
    <g transform="translate(800,40)">
      <rect width="260" height="60" rx="10" fill="#1a1a1f" stroke="#2a2a30"/>
      <text x="16" y="24" fill="#fafafa" font-size="13" font-weight="600">Middleware</text>
      <text x="16" y="44" fill="#9b9ba0" font-size="10">Session refresh on every route</text>
    </g>

    <!-- Business logic -->
    <g transform="translate(20,118)">
      <rect width="500" height="50" rx="10" fill="#1f1c12" stroke="#3a3220"/>
      <text x="16" y="22" fill="#f0b429" font-size="12" font-weight="600">lib/goals.ts - pure business logic</text>
      <text x="16" y="38" fill="#a89572" font-size="10">Validation · 4 scoring formulas · quarter windows · shared on client + server</text>
    </g>
    <g transform="translate(540,118)">
      <rect width="520" height="50" rx="10" fill="#1f1c12" stroke="#3a3220"/>
      <text x="16" y="22" fill="#f0b429" font-size="12" font-weight="600">lib/actions.ts - mutation layer</text>
      <text x="16" y="38" fill="#a89572" font-size="10">RLS-enforced writes · audit log on every change · notification fan-out</text>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- TIER 3 - Data + Identity                                          -->
  <!-- ============================================================== -->
  <g transform="translate(60,555)">
    <text x="0" y="0" fill="#6b6b73" font-size="10" font-weight="600" letter-spacing="2">DATA &amp; IDENTITY · SUPABASE</text>

    <g transform="translate(0,15)">
      <rect width="340" height="160" rx="12" fill="#0e1620" stroke="#1c2a3a"/>
      <text x="20" y="30" fill="#60a5fa" font-size="13" font-weight="600">Postgres 15</text>
      <text x="20" y="48" fill="#9b9ba0" font-size="10">users · cycles · goal_sheets · goals · check_ins</text>
      <text x="20" y="62" fill="#9b9ba0" font-size="10">audit_log · notifications · escalation_rules · events</text>
      <line x1="20" y1="78" x2="320" y2="78" stroke="#1c2a3a"/>
      <text x="20" y="98" fill="#60a5fa" font-size="11" font-weight="600">Row Level Security</text>
      <text x="20" y="114" fill="#9b9ba0" font-size="10">Employees see own · Managers see team · Admin sees all</text>
      <text x="20" y="128" fill="#9b9ba0" font-size="10">current_user_role() + is_manager_of() helpers</text>
      <text x="20" y="146" fill="#6b6b73" font-size="9">Saves a separate authorisation service · $0 of auth infra</text>
    </g>

    <g transform="translate(360,15)">
      <rect width="340" height="160" rx="12" fill="#101a17" stroke="#1c322a"/>
      <text x="20" y="30" fill="#4ade80" font-size="13" font-weight="600">Supabase Auth</text>
      <text x="20" y="48" fill="#9b9ba0" font-size="10">Cookie-based session · auto-refresh middleware</text>
      <text x="20" y="62" fill="#9b9ba0" font-size="10">JWT carries user.id · RLS reads auth.uid()</text>
      <line x1="20" y1="78" x2="320" y2="78" stroke="#1c322a"/>
      <text x="20" y="98" fill="#4ade80" font-size="11" font-weight="600">Microsoft Entra ID (mock)</text>
      <text x="20" y="114" fill="#9b9ba0" font-size="10">OAuth shape mirrors /me · groups → roles</text>
      <text x="20" y="128" fill="#9b9ba0" font-size="10">manager attribute → org hierarchy sync</text>
      <text x="20" y="146" fill="#6b6b73" font-size="9">Swap to real Entra: one HTTP call. Same contract.</text>
    </g>

    <g transform="translate(720,15)">
      <rect width="360" height="160" rx="12" fill="#1a1322" stroke="#2a1f3a"/>
      <text x="20" y="30" fill="#c084fc" font-size="13" font-weight="600">Vercel Cron</text>
      <text x="20" y="48" fill="#9b9ba0" font-size="10">Nightly trigger of /api/cron/escalations</text>
      <text x="20" y="62" fill="#9b9ba0" font-size="10">Detects: draft sheets · approval pending · check-in overdue</text>
      <line x1="20" y1="78" x2="340" y2="78" stroke="#2a1f3a"/>
      <text x="20" y="98" fill="#c084fc" font-size="11" font-weight="600">Notification fan-out</text>
      <text x="20" y="114" fill="#9b9ba0" font-size="10">Email + Teams + InApp written to notifications table</text>
      <text x="20" y="128" fill="#9b9ba0" font-size="10">Production: swap to SendGrid / MS Graph senders</text>
      <text x="20" y="146" fill="#6b6b73" font-size="9">Cron + queueing = $0 with current volumes</text>
    </g>
  </g>

  <!-- Arrows between tiers -->
  <g stroke="#f0b429" stroke-width="1.5" fill="none">
    <path d="M 170 280 L 170 340" marker-end="url(#arrow)"/>
    <path d="M 410 280 L 410 340" marker-end="url(#arrow)"/>
  </g>
  <g stroke="#6b6b73" stroke-width="1.2" fill="none">
    <path d="M 170 520 L 170 565" marker-end="url(#arrow-mute)"/>
    <path d="M 530 520 L 530 565" marker-end="url(#arrow-mute)"/>
    <path d="M 900 520 L 900 565" marker-end="url(#arrow-mute)"/>
  </g>

  <!-- Cost callouts -->
  <g transform="translate(720,180)">
    <rect width="380" height="86" rx="10" fill="#0e1f15" stroke="#1c3a2a"/>
    <text x="20" y="28" fill="#4ade80" font-size="11" font-weight="600" letter-spacing="2">COST OPTIMISATION</text>
    <text x="20" y="48" fill="#fafafa" font-size="13">$0/mo · 100% free tier compatible</text>
    <text x="20" y="64" fill="#9b9ba0" font-size="10">Vercel Hobby: 100GB bandwidth · Supabase: 500MB DB · 50k MAU</text>
    <text x="20" y="78" fill="#9b9ba0" font-size="10">Serverless = pay-per-use · No idle EC2 · No always-on Postgres pool</text>
  </g>

  <!-- Footer -->
  <text x="60" y="730" fill="#5a5a60" font-size="10">Plumeo · Next.js · Supabase · Vercel</text>
  <text x="1140" y="730" fill="#5a5a60" font-size="10" text-anchor="end">github.com/Vansh150705/Plumeo</text>
</svg>
